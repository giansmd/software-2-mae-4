# docker-compose.yml — Orquesta db + backend + frontend de MAE-4.
# Arranca todo con:  docker compose up
# (necesitas Docker + el plugin compose instalados; nada más global).
# JWT_SECRET es OBLIGATORIO (SEC-001): defínelo en .env o exportado, p.ej.
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up

services:
  db:
    image: postgres:18.6
    container_name: mae4-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria (SEC-006); genera una con: openssl rand -hex 24}"
      POSTGRES_DB: ${POSTGRES_DB:-mae4}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mae4}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - mae4

  backend:
    build: ./backend
    container_name: mae4-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/mae4}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET es obligatorio (SEC-001); genera uno con: openssl rand -hex 32}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
      SEED_ON_STARTUP: "true"  # perfil demo (DOC-001): credenciales demo conocidas; SOLO local
      UVICORN_RELOAD: ${UVICORN_RELOAD:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mae4

  frontend:
    build:
      context: ./frontend
      args:
        # Queda cocinada en el bundle en build-time: en Dokploy define
        # NEXT_PUBLIC_API_URL con la URL pública (p.ej. https://dominio/api).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: mae4-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mae4

volumes:
  pgdata:

networks:
  mae4:
    driver: bridge
