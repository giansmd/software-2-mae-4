[project]
name = "mae4-backend"
version = "0.1.0"
description = "MAE-4 Gemelo digital hidrogeomorfológico de humedales costeros y carbono azul"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
    "psycopg2-binary==2.9.12",
    "reportlab==5.0.1",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"